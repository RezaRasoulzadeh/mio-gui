<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Mio-GUI text reference</title>
<style>
  @font-face {
    font-family: "Vazirmatn Reference";
    src: url("../assets/fonts/vazirmatn/Vazirmatn-Regular.ttf") format("truetype");
    font-weight: 400;
  }

  html,
  body {
    margin: 0;
    background: #626269;
    color: #19150d;
    font-family: "Vazirmatn Reference";
  }

  main {
    box-sizing: border-box;
    width: 800px;
    padding: 32px;
  }

  section {
    margin-bottom: 16px;
    padding: 12px 16px;
    border-radius: 16px;
    background: #f59e0b;
    font-size: 20px;
    line-height: 28px;
    white-space: nowrap;
  }

  output {
    display: block;
    direction: ltr;
    font: 12px monospace;
    color: #ffffff;
  }
</style>
<main id="fixtures"></main>
<script>
  const fixtures = [
    ["persian", "رابط کاربری راست‌به‌چپ", "auto"],
    ["arabic", "واجهة مستخدم من اليمين إلى اليسار", "auto"],
    ["mixed-persian", "نسخه Mio-GUI 2.0 (آماده)", "auto"],
    ["mixed-arabic", "الإصدار Mio-GUI 2.0 (جاهز)", "auto"],
    ["forced-ltr", "Mio-GUI نسخه 2", "ltr"],
    ["forced-rtl", "Mio-GUI نسخه 2", "rtl"],
  ];

  document.fonts.ready.then(() => {
    const canvas = document.createElement("canvas");
    const context = canvas.getContext("2d");
    context.font = '400 20px "Vazirmatn Reference"';
    const root = document.getElementById("fixtures");
    for (const [name, text, direction] of fixtures) {
      context.direction = direction;
      const section = document.createElement("section");
      section.dir = direction;
      section.textContent = text;
      const output = document.createElement("output");
      output.textContent = `${name}\t${context.measureText(text).width.toFixed(3)}`;
      root.append(section, output);
    }
    document.body.dataset.ready = "true";
  });
</script>
</html>
